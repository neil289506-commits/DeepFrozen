name: Fabric Builds

on:
  push:
    branches:
      - Fabric
    paths:
      - "Fabric/**"
      - ".github/workflows/Fabric.yaml"
  pull_request:
    paths:
      - "Fabric/**"
      - ".github/workflows/Fabric.yaml"
  workflow_dispatch:

# contents: write is only used to publish the build log of a failed build to a branch (ci-logs-<version>)
permissions:
  contents: write

jobs:
  build:
    name: Fabric ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "26.1"
            allow_failure: false
          - version: "26.1.1"
            allow_failure: false
          - version: "26.1.2"
            allow_failure: false
          - version: "26.2"
            allow_failure: false
          - version: "26.3"
            allow_failure: true

    continue-on-error: ${{ matrix.allow_failure }}

    defaults:
      run:
        working-directory: Fabric/${{ matrix.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: deepfrozen-fabric-${{ matrix.version }}
          path: |
            Fabric/${{ matrix.version }}/build/libs/*.jar
            !Fabric/${{ matrix.version }}/build/libs/*-sources.jar
          if-no-files-found: error

      - name: Publish build log to branch ci-logs-${{ matrix.version }}
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/push
          tail -n 400 build.log > /tmp/push/build-tail.log || true
          grep -n -E "error:|warning: \[|FAILED|What went wrong|Caused by" build.log | head -80 > /tmp/push/errors.log || true
          # API dump of the real Minecraft jar, so signature changes can be fixed without guessing
          JAR=$(find ~/.gradle -name '*.jar' -path '*loom*' -size +20M 2>/dev/null | grep -iE 'minecraft' | grep -viE 'sources|natives' | head -1 || true)
          echo "jar: $JAR" > /tmp/push/api.log
          if [ -n "$JAR" ]; then
            for c in net.minecraft.world.level.material.PushReaction net.minecraft.world.entity.LivingEntity net.minecraft.world.entity.Mob net.minecraft.world.entity.Entity net.minecraft.world.entity.SwingAnimation net.minecraft.world.level.block.Block net.minecraft.world.level.block.state.BlockBehaviour net.minecraft.world.level.block.SpeleothemBlock net.minecraft.world.level.block.state.BlockState net.minecraft.world.entity.monster.zombie.Drowned net.minecraft.world.entity.monster.zombie.Zombie net.minecraft.world.entity.monster.Zombie net.minecraft.world.entity.monster.Drowned net.minecraft.server.level.ServerPlayer; do
              echo "=== $c" >> /tmp/push/api.log
              javap -protected -cp "$JAR" "$c" 2>&1 | grep -E "swing|hurtMarked|Marked|sync|Sync|Velocity|velocity|DESTROY|BREAK|PUSH|NORMAL|BLOCK|IGNORE|codec|Codec|blocksMotion|isSolid|Collision|convert|Convert|UnderWater|class |enum |interface " >> /tmp/push/api.log || true
            done
          fi
          cd /tmp/push && git init -q && git checkout -q -b "ci-logs-${{ matrix.version }}"
          git config user.name github-actions && git config user.email actions@github.com
          git add . && git commit -q -m "build log ${{ matrix.version }}" || true
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "ci-logs-${{ matrix.version }}"

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deepfrozen-fabric-${{ matrix.version }}-failure
          path: |
            Fabric/${{ matrix.version }}/build/reports/
            Fabric/${{ matrix.version }}/build/test-results/
          if-no-files-found: ignore
